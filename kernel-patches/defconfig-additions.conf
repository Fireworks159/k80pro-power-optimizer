# ============================================================
# K80 Pro Power Optimizer - 内核 defconfig 附加配置
# 用于编译自定义内核时追加到默认 defconfig 中
# ============================================================
#
# 使用方法:
#   SM8750 (sun) 平台使用 GKI + vendor fragment 方式:
#   make ARCH=arm64 gki_defconfig vendor/sun_perf.config vendor/miro_perf.config
#   然后追加本文件中的配置:
#   cat defconfig-additions.conf >> out/.config && make olddefconfig
#
# 注意: 本文件仅包含 Linux 6.6 主线 + MiCode bsp-miro-v-oss 中
#       确实存在的 Kconfig 选项。已移除:
#   - CONFIG_PM_RUNTIME       (6.x 起合并入 CONFIG_PM)
#   - CONFIG_CPU_FREQ_GOV_INTERACTIVE (6.x 从主线移除)
#   - CONFIG_IOSCHED_MAPLE    (主线不存在)
#   - CONFIG_DEFAULT_IOSCHED  (6.x 移除)
#   - CONFIG_ZRAM_LZ4_COMPRESS (不存在)
#   - CONFIG_WAKELOCK         (主线不存在)
#   - CONFIG_CPU_FREQ_GOV_WALT (仅 Qualcomm vendor 树有)
#   - CONFIG_GKI_HACKS_TO_FIX (仅 GKI 测试树有)
#   - CONFIG_FW_CS_DSP / CONFIG_CL_DSP (Cirrus DSP 在 NeutronClang 下编译错误)
# ============================================================

# ---- 自定义内核版本标识 ----
CONFIG_LOCALVERSION="-k80pro-optimized"
# CONFIG_LOCALVERSION_AUTO is not set

# ---- 编译器 / -Werror 控制 ----
# 关闭 WERROR: NeutronClang 对未修改的上游文件 (如 mm/shmem.c)
# 会产生 -Wdefault-const-init-field-unsafe 等警告，CONFIG_WERROR
# 会将其升级为 error 导致编译中断。
# CONFIG_WERROR is not set

# ---- 不公平调度核心 (Patch 0001) ----
CONFIG_CGROUPS=y
CONFIG_CPUSETS=y
CONFIG_CGROUP_CPUACCT=y
CONFIG_CGROUP_SCHED=y
CONFIG_FAIR_GROUP_SCHED=y
CONFIG_CGROUP_PIDS=y
CONFIG_SCHED_DEBUG=y
CONFIG_SCHED_INFO=y
CONFIG_SCHEDSTATS=y
CONFIG_SMP=y
CONFIG_SCHED_MC=y
CONFIG_SCHED_SMT=y

# ---- EEVDF 调度器调优 (Patch 0002) ----
CONFIG_CPU_FREQ=y
CONFIG_CPU_FREQ_STAT=y
CONFIG_CPU_FREQ_GOV_PERFORMANCE=y
CONFIG_CPU_FREQ_GOV_POWERSAVE=y
CONFIG_CPU_FREQ_GOV_USERSPACE=y
CONFIG_CPU_FREQ_GOV_SCHEDUTIL=y
CONFIG_ENERGY_MODEL=y
CONFIG_CPU_IDLE=y
CONFIG_CPU_IDLE_MULTIPLE_DRIVERS=y
CONFIG_CPU_IDLE_GOV_MENU=y
CONFIG_CPU_IDLE_GOV_LADDER=y

# ---- 电源管理优化 (Patch 0003) ----
CONFIG_PM=y
CONFIG_PM_SLEEP=y
CONFIG_PM_SLEEP_SMP=y
CONFIG_SUSPEND=y
CONFIG_PM_AUTOSLEEP=y
CONFIG_PM_WAKELOCKS=y
CONFIG_PM_WAKELOCKS_LIMIT=0
CONFIG_PM_WAKELOCKS_GC=y

# ---- 内存与 I/O 优化 ----
CONFIG_ZRAM=y
CONFIG_ZRAM_WRITEBACK=y
CONFIG_ZRAM_MEMORY_TRACKING=y
CONFIG_LZ4_COMPRESS=y
CONFIG_LZ4HC_COMPRESS=y
CONFIG_ZRAM_DEF_COMP="lzo-rle"
CONFIG_KSM=y
CONFIG_IOSCHED_BFQ=y
CONFIG_IOSCHED_KYBER=y
CONFIG_MQ_IOSCHED_DEADLINE=y

# ---- GPU / 显示相关 ----
CONFIG_DEVFREQ=y

# ---- 调试与监控 ----
CONFIG_DEBUG_FS=y
CONFIG_MAGIC_SYSRQ=y

# ---- SukiSU-Ultra 内核 Root (KPROBES hook) ----
# 注意: CONFIG_KSU 需要 SukiSU-Ultra 已集成到内核源码中。
# 如果跳过 SukiSU 集成 (SKIP_SUKISU=1)，此选项将导致编译失败。
# 当 SKIP_SUKISU=1 时，构建脚本会自动注释掉这两行。
CONFIG_KSU=y
CONFIG_KPROBES=y
# CONFIG_KSU_MANUAL_HOOK is not set
# CONFIG_KSU_TRACEPOINT_HOOK is not set
CONFIG_KALLSYMS=y
CONFIG_KALLSYMS_ALL=y

# ---- 安全与兼容 ----
CONFIG_SECURITY_SELINUX=y

# ---- 禁用 MiCode OSS 有问题的驱动 ----
# CONFIG_PERF_HELPER is not set
# CONFIG_FW_CS_DSP is not set
# CONFIG_CL_DSP is not set
# ---- 修复 MiCode OSS 缺失依赖 ----
# miro_consolidate.config 启用了 CONFIG_MTD_OOPS=m，它引用 pwrkey_irq_notifier_list，
# 但对应的 pm8941-pwrkey 驱动未启用，导致链接失败。
CONFIG_MFD_SPMI_PMIC=y
CONFIG_INPUT_PM8941_PWRKEY=y

