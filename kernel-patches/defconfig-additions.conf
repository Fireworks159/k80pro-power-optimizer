# ============================================================
# K80 Pro Power Optimizer - 内核 defconfig 附加配置
# 用于编译自定义内核时追加到默认 defconfig 中
# ============================================================
#
# 注意: 本文件现在采用"最小侵入"原则。GKI 2.0 设备的 vendor_dlkm
# 模块通过 vermagic 校验内核版本，因此不能修改 CONFIG_LOCALVERSION，
# 否则原厂 vendor 模块会拒绝加载，导致卡第一屏。
# ============================================================

# ---- 编译器 / -Werror 控制 ----
# 关闭 WERROR: NeutronClang 对未修改的上游文件会产生
# -Wdefault-const-init-field-unsafe 等警告，CONFIG_WERROR
# 会将其升级为 error 导致编译中断。
# CONFIG_WERROR is not set

# ---- SukiSU-Ultra 内核 Root (KPROBES hook) ----
# 注意: CONFIG_KSU 需要 SukiSU-Ultra 已集成到内核源码中。
# 如果跳过 SukiSU 集成 (SKIP_SUKISU=1)，构建脚本会自动跳过此选项。
CONFIG_KSU=y
CONFIG_KPROBES=y
# CONFIG_KSU_MANUAL_HOOK is not set
# CONFIG_KSU_TRACEPOINT_HOOK is not set
CONFIG_KALLSYMS=y
CONFIG_KALLSYMS_ALL=y

# ---- 禁用 MiCode OSS 有问题的驱动 ----
# 这些驱动依赖小米私有 vendor hooks，在 OSS / NeutronClang 下编译失败。
# CONFIG_PERF_HELPER is not set
# CONFIG_FW_CS_DSP is not set
# CONFIG_CL_DSP is not set
# ---- 修复 MiCode OSS 缺失依赖 ----
# miro_consolidate.config 启用了 CONFIG_MTD_OOPS=m，它无条件引用 pm8941-pwrkey
# 导出的 pwrkey_irq_notifier_list 符号。在 OSS 构建中 SPMI 总线是模块，导致
# INPUT_PM8941_PWRKEY 只能编译为模块，无法满足内置 mtdoops 的链接需求。
# 直接禁用 MTD_OOPS 避免该符号依赖。
# CONFIG_MTD_OOPS is not set
